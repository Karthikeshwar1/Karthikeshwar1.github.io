<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karthikeshwar - Works</title>
  <style>
    @font-face {
      font-family: "calendas_plusregular";
      src: url("assets/fonts/calendas_plus-webfont.woff2") format("woff2"),
           url("assets/fonts/calendas_plus-webfont.woff") format("woff");
      font-weight: normal;
      font-style: normal;
    }
    :root {
      /* Palette */
      --ground: #f8f8f8;
      --ink: #0d0e0d;
      --ink-secondary: #cacaca;
      --border-subtle: #939393;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--ground);
      color: var(--ink);
      font-family: "calendas_plusregular", Georgia, serif;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Fixed aspect layout matching comp precisely */
    .viewport-frame {
      position: relative;
      width: 100%;
      height: 0;
      padding-bottom: 100%; /* 1:1 aspect ratio */
      max-width: 1024px;
      max-height: 1024px;
      background-color: var(--ground);
      margin: 0 auto;
    }

    /* Container for absolute positioning inside the padding-hack box */
    .content {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .plate {
      position: absolute;
      top: 10%;
      left: 10%;
      width: 70%;
      height: 80%;
      object-fit: cover;
    }

    .nav {
      position: absolute;
      top: 15%;
      left: 22%;
      width: 54%;
      height: 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-transform: uppercase;
      font-size: 13px;
      letter-spacing: 0.15em;
      color: #090909;
      line-height: 1;
    }
    
    .nav a {
      color: inherit;
      text-decoration: none;
    }
    
    .nav span {
      opacity: 0.5;
    }

    .caption {
      position: absolute;
      top: 80%;
      left: 22%;
      width: 48%;
      height: 4%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      text-align: center;
      font-size: 13px;
      letter-spacing: 0.05em;
      color: #080808;
      line-height: 1.5;
    }
    
    .caption span {
        display: block;
    }

    .scroll-down {
      position: absolute;
      top: 90%;
      left: 30%;
      width: 20%;
      height: 10%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    .scroll-down::after {
        content: "?";
        display: block;
        font-size: 32px;
        color: #080808;
    }
    
    /* Lock layout when viewport exceeds max-width */
    @media (min-width: 1024px) {
        .viewport-frame {
            height: 1024px;
            padding-bottom: 0;
            width: 1024px;
        }
        
        .plate {
            top: 10%;
            left: 10%;
            width: 70%;
            height: 80%;
        }
        .nav {
            top: 15%;
            left: 22%;
            width: 54%;
            height: 5%;
        }
        .caption {
            top: 80%;
            left: 22%;
            width: 48%;
            height: 4%;
        }
    }
  </style>
</head>
<body>
  <div class="viewport-frame">
    <div class="content">
      <!-- Plate first (drawn behind text) -->
      <img src="assets/plates/hero-plate.png" alt="UNTITLED NO. 14, 2024" class="plate">

      <!-- Exact words from the comp -->
      <nav class="nav">
        <a href="/">HOME</a> <span>|</span>
        <a href="/works/">WORKS</a> <span>|</span>
        <a href="/about/">BIOGRAPHY</a> <span>|</span>
        <a href="/shop/">SHOP</a> <span>|</span>
        <a href="/contact/">CONTACT</a>
      </nav>

      <div class="caption">
        <span>UNTITLED NO. 14, 2024.</span>
        <span style="color: #7a7a7a">GELATIN SILVER PRINT.</span>
      </div>

      <div class="scroll-down">
      </div>
    </div>
  </div>
</body>
</html>
