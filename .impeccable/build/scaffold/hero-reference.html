<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: comp_2.png</title>
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f8f8f8}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1024px">
  <div class="r-masthead region text" data-region="masthead"><!-- navigation text links --><p style="line-height:1.05;margin:0">masthead</p></div>
  <figure class="r-hero-plate region plate" data-region="hero-plate"><img src="../../../assets/plates/hero-plate.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-artwork-caption region text" data-region="artwork-caption"><!-- text caption with title and details --><p style="line-height:1.05;margin:0">artwork-caption</p></div>
  <div class="r-scroll-indicator region chrome" data-region="scroll-indicator"><!-- downward pointing arrow --></div>
</main>
</body>
</html>
